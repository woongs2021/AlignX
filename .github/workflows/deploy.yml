name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # Thumbnails/(원본, 커밋됨) → public/images/hero·thumbs(gitignore) 재생성.
      # Font/·Portfolio-samples/ 원본은 저장소에 없어 해당 스크립트는 에러 없이 스킵된다
      # (01 §3.5) — 그 산출물(public/fonts/, public/samples/)은 이미 커밋돼 있어 문제 없다.
      - run: npm run assets
      - run: npm run lint
      - run: npm run test
      - run: npm run build # tsc --noEmit 포함
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
